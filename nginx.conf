# Outer rate limit for the contact API (the contact container has its own,
# stricter per-message limits). conf.d files are included inside `http {}`.
limit_req_zone $binary_remote_addr zone=contact:1m rate=10r/m;

server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # The public reverse proxy sits in front of this container on a private
    # network: trust its X-Forwarded-For so rate limits see real client IPs.
    set_real_ip_from 10.0.0.0/8;
    set_real_ip_from 172.16.0.0/12;
    set_real_ip_from 192.168.0.0/16;
    real_ip_header X-Forwarded-For;
    real_ip_recursive on;

    gzip on;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;

    location / {
        try_files $uri $uri/ $uri/index.html =404;
    }

    location /api/contact {
        limit_req zone=contact burst=5 nodelay;
        limit_req_status 429;
        client_max_body_size 16k;

        # Resolve the contact service lazily (Docker DNS) so the site still
        # starts and serves pages if that container is down.
        resolver 127.0.0.11 valid=30s ipv6=off;
        set $contact_upstream http://contact:3000;
        proxy_pass $contact_upstream;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header Host $host;
    }

    location /Dunji/ {
        gzip off;
        location ~ \.wasm$ {
            types { application/wasm wasm; }
        }
    }
}
