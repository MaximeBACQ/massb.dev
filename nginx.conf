# Outer rate limit for the contact API (the contact container has its own,
# stricter per-message limits). conf.d files are included inside `http {}`.
limit_req_zone $binary_remote_addr zone=contact:1m rate=10r/m;

# Content-Security-Policy, picked per path. The Astro pages also carry a
# stricter <meta> CSP with per-build script hashes (astro.config.mjs); the
# browser enforces both, so this header only needs to allow what the <meta>
# tightens. /Repos/ (no <meta>) only needs its onclick="" attributes. The
# Unity WebGL builds need blob: scripts/workers and eval for wasm.
map $uri $csp {
    ~^/Repos/       "default-src 'self'; script-src 'self'; script-src-attr 'unsafe-inline'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self'; connect-src 'self'; media-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'self'; upgrade-insecure-requests";
    default         "default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self'; connect-src 'self'; media-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'self'; upgrade-insecure-requests";
    ~^/(Dunji|UrbanWilds)/ "default-src 'self'; script-src 'self' 'unsafe-inline' 'unsafe-eval' 'wasm-unsafe-eval' blob:; worker-src 'self' blob:; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; font-src 'self' data:; connect-src 'self' blob: data:; media-src 'self' blob:; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'self'; upgrade-insecure-requests";
}

server {
    listen 80;
    server_name _;

    # Don't advertise the nginx version on error pages / Server header.
    server_tokens off;

    root /usr/share/nginx/html;
    index index.html;

    # Recover the real visitor IP so rate limits are per visitor. Traffic goes
    # visitor -> Cloudflare -> reverse proxy (private network) -> here, and each
    # hop appends to X-Forwarded-For. Walking it from the right while skipping
    # trusted hops (private ranges + Cloudflare's published ranges) lands on the
    # first address nobody trusted appended: the visitor. A spoofed
    # X-Forwarded-For only adds entries to the left, so it can't win.
    # Cloudflare ranges: https://www.cloudflare.com/ips/ (update if they change).
    set_real_ip_from 10.0.0.0/8;
    set_real_ip_from 172.16.0.0/12;
    set_real_ip_from 192.168.0.0/16;
    set_real_ip_from 173.245.48.0/20;
    set_real_ip_from 103.21.244.0/22;
    set_real_ip_from 103.22.200.0/22;
    set_real_ip_from 103.31.4.0/22;
    set_real_ip_from 141.101.64.0/18;
    set_real_ip_from 108.162.192.0/18;
    set_real_ip_from 190.93.240.0/20;
    set_real_ip_from 188.114.96.0/20;
    set_real_ip_from 197.234.240.0/22;
    set_real_ip_from 198.41.128.0/17;
    set_real_ip_from 162.158.0.0/15;
    set_real_ip_from 104.16.0.0/13;
    set_real_ip_from 104.24.0.0/14;
    set_real_ip_from 172.64.0.0/13;
    set_real_ip_from 131.0.72.0/22;
    set_real_ip_from 2400:cb00::/32;
    set_real_ip_from 2606:4700::/32;
    set_real_ip_from 2803:f800::/32;
    set_real_ip_from 2405:b500::/32;
    set_real_ip_from 2405:8100::/32;
    set_real_ip_from 2a06:98c0::/29;
    set_real_ip_from 2c0f:f248::/32;
    real_ip_header X-Forwarded-For;
    real_ip_recursive on;

    # Security headers. Set here once: no location below uses add_header, so
    # they all inherit these (nginx drops inherited add_header otherwise).
    add_header Content-Security-Policy $csp always;
    add_header Strict-Transport-Security "max-age=31536000" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=(), usb=(), fullscreen=(self)" always;
    add_header Cross-Origin-Opener-Policy "same-origin" always;

    # Declare UTF-8 in Content-Type so legacy pages without a <meta charset>
    # (e.g. /Repos/) and their JS/CSS don't get decoded as Windows-1252.
    charset utf-8;
    charset_types text/css application/javascript text/plain image/svg+xml;

    gzip on;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;

    location / {
        try_files $uri $uri/ $uri/index.html =404;
    }

    location /api/contact {
        limit_req zone=contact burst=5 nodelay;
        limit_req_status 429;
        client_max_body_size 16k;

        # Resolve the contact service lazily (Docker DNS) so the site still
        # starts and serves pages if that container is down.
        resolver 127.0.0.11 valid=30s ipv6=off;
        set $contact_upstream http://contact:3000;
        proxy_pass $contact_upstream;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header Host $host;
    }

    location /Dunji/ {
        gzip off;
        location ~ \.wasm$ {
            types { application/wasm wasm; }
        }
    }
}
