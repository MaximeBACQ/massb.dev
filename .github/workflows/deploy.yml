name: build-and-push
on:
  push:
    branches: [main]
jobs:
  docker:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      # Actions are pinned to full commit SHAs (a tag can be moved to malicious
      # code, a SHA can't). Dependabot keeps them updated, see dependabot.yml.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: set lower case owner name #needed because MaximeBACQ causes an error in github actions : ghcr repo needs to be lowercase
        run: echo "OWNER_LC=${OWNER,,}" >> ${GITHUB_ENV}
        env:
          OWNER: '${{ github.repository_owner }}'

      - uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6.19.2
        with:
          context: .
          push: true
          tags: |
            ghcr.io/${{ env.OWNER_LC }}/portfolio:latest
            ghcr.io/${{ env.OWNER_LC }}/portfolio:${{ github.sha }}

      - uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6.19.2
        with:
          context: ./contact-api
          push: true
          tags: |
            ghcr.io/${{ env.OWNER_LC }}/portfolio-contact:latest
            ghcr.io/${{ env.OWNER_LC }}/portfolio-contact:${{ github.sha }}
